<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <meta name="description" content="日々の作業に役立つ、小さなWebツールをまとめたポータルサイト。">
  <title>ss_sites — Personal Tool Library</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131c;
      --panel: rgba(25, 30, 44, .82);
      --panel-solid: #191e2c;
      --panel-hover: #20283a;
      --text: #f3f5fb;
      --muted: #a3acc0;
      --line: rgba(190, 204, 235, .13);
      --accent: #a8b8ff;
      --accent-2: #82e2d0;
      --shadow: 0 24px 70px rgba(0,0,0,.28);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 0%, rgba(105, 122, 255, .19), transparent 38rem),
        radial-gradient(ellipse at 92% 18%, rgba(71, 210, 188, .11), transparent 34rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px;
      border-radius: 13px; color: #111827; font-size: 19px; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 7px 24px rgba(130, 190, 220, .18);
    }
    .brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .16em; }
    .top-link { color: var(--muted); font-size: 13px; transition: color .2s; }
    .top-link:hover { color: var(--text); }
    .hero { padding: clamp(54px, 9vw, 100px) 0 46px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--accent-2); font-size: 11px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: currentColor; }
    h1 {
      max-width: 760px; margin: 18px 0 15px;
      font-size: clamp(38px, 7vw, 68px); line-height: 1.08;
      letter-spacing: -.055em; font-weight: 780;
    }
    h1 span {
      color: transparent; background: linear-gradient(100deg, #c2caff 12%, #8ce6d5 88%);
      -webkit-background-clip: text; background-clip: text;
    }
    .intro { max-width: 610px; margin: 0; color: var(--muted); font-size: clamp(14px, 2vw, 16px); }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin: 14px 0 22px;
    }
    .section-heading { margin: 0; font-size: 19px; letter-spacing: -.025em; }
    .count { margin-left: 9px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .search-wrap { position: relative; width: min(310px, 100%); }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search {
      width: 100%; padding: 11px 14px 11px 42px; color: var(--text);
      background: rgba(255,255,255,.045); border: 1px solid var(--line);
      border-radius: 13px; outline: none; transition: border .2s, background .2s;
    }
    .search:focus { border-color: rgba(168,184,255,.65); background: rgba(255,255,255,.07); }
    .search::placeholder { color: #778197; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
    .card {
      position: relative; display: flex; flex-direction: column; min-height: 218px;
      padding: 22px; overflow: hidden; isolation: isolate;
      background: linear-gradient(145deg, rgba(31,38,56,.92), rgba(22,27,40,.88));
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
      transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }
    .card::after {
      content: ""; position: absolute; z-index: -1; width: 150px; height: 150px;
      right: -70px; top: -80px; border-radius: 50%;
      background: var(--glow, rgba(168,184,255,.16)); filter: blur(5px);
      transition: transform .25s ease;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(168,184,255,.38); box-shadow: var(--shadow); background: linear-gradient(145deg, #222a3d, #1a2030); }
    .card:hover::after { transform: scale(1.35); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .tool-icon {
      display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 auto;
      border-radius: 15px; background: var(--icon-bg, rgba(168,184,255,.13));
      color: var(--icon-color, #c4ceff); font-size: 23px;
    }
    .tag {
      padding: 5px 9px; border: 1px solid rgba(130,226,208,.2); border-radius: 999px;
      color: var(--accent-2); background: rgba(130,226,208,.07);
      font-size: 10px; font-weight: 750; letter-spacing: .04em;
    }
    .card h3 { margin: 20px 0 6px; font-size: 17px; letter-spacing: -.025em; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 22px; }
    .category { color: #8994aa; font-size: 11px; }
    .arrow {
      display: grid; place-items: center; width: 31px; height: 31px; border-radius: 50%;
      color: var(--text); background: rgba(255,255,255,.07); transition: background .2s, transform .2s;
    }
    .card:hover .arrow { background: rgba(168,184,255,.2); transform: translateX(2px); }
    .empty {
      display: none; padding: 35px 20px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius);
    }
    .note {
      display: flex; align-items: flex-start; gap: 13px; margin: 34px 0 0;
      padding: 17px 19px; border: 1px solid var(--line); border-radius: 16px;
      background: rgba(255,255,255,.025); color: var(--muted); font-size: 12px;
    }
    .note strong { display: block; margin-bottom: 2px; color: var(--text); font-size: 12px; }
    .note-icon { color: var(--accent); font-size: 17px; line-height: 1.4; }
    footer {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-top: 72px; padding: 22px 0 30px; border-top: 1px solid var(--line);
      color: #778197; font-size: 11px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 560px) {
      .shell { width: min(100% - 30px, 480px); }
      .topbar { padding: 18px 0; }
      .top-link { font-size: 11px; }
      .hero { padding: 55px 0 35px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search-wrap { width: 100%; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card { min-height: 195px; padding: 19px; }
      footer { margin-top: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="ss_sites ホーム">
        <span class="brand-mark">S</span>
        <span>ss_sites<small>PERSONAL TOOL LIBRARY</small></span>
      </a>
      <a class="top-link" href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">A small collection of useful tools</div>
        <h1>日々の作業を、<br><span>もっとシンプルに。</span></h1>
        <p class="intro">自分用に作った便利なWebツールをまとめた場所。必要な機能へ、すばやくアクセスできます。</p>
      </section>

      <section aria-labelledby="tools-heading">
        <div class="toolbar">
          <h2 class="section-heading" id="tools-heading">TOOLS <span class="count" id="tool-count"></span></h2>
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input class="search" id="search" type="search" placeholder="ツールを検索..." autocomplete="off" aria-label="ツールを検索">
          </label>
        </div>

        <div class="grid" id="tool-grid"></div>
        <div class="empty" id="empty">該当するツールが見つかりませんでした。</div>
      </section>

      <aside class="note">
        <span class="note-icon">✦</span>
        <div><strong>このサイトについて</strong>個人制作のツール集です。ツールは随時追加・更新していきます。</div>
      </aside>
    </main>

    <footer>
      <span>© <span id="year"></span> ss_sites</span>
      <span>Made for everyday convenience.</span>
    </footer>
  </div>

  <script>
    /*
      ツールを追加するときは、下の配列に1件追加するだけです。
      1. tools/ の中にツール用フォルダを作る
      2. その中に index.html を置く
      3. 下の配列に title / description / category / icon / path を追加する

      例:
      {
        title: "単位変換ツール",
        description: "長さや重さなどの単位をすばやく変換。",
        category: "計算・変換",
        icon: "⇄",
        path: "tools/unit-converter/",
        status: "公開中"
      }
    */
    const tools = [
      {
        title: "高画質画像検索",
        description: "画像サイズや縦横比、色、形式などを指定してGoogle画像検索を開きます。",
        category: "画像・検索",
        icon: "▧",
        path: "tools/image-search/",
        status: "公開中",
        glow: "rgba(130,226,208,.19)",
        iconBg: "rgba(130,226,208,.12)",
        iconColor: "#8ce6d5"
      }
    ];

    const grid = document.getElementById("tool-grid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const count = document.getElementById("tool-count");

    function renderTools(query = "") {
      const normalized = query.trim().toLocaleLowerCase("ja");
      const filtered = tools.filter(tool =>
        [tool.title, tool.description, tool.category].join(" ").toLocaleLowerCase("ja").includes(normalized)
      );

      grid.innerHTML = filtered.map(tool => `
        <a class="card" href="${escapeAttribute(tool.path)}"
           style="--glow:${escapeAttribute(tool.glow || "rgba(168,184,255,.16)")};
                  --icon-bg:${escapeAttribute(tool.iconBg || "rgba(168,184,255,.13)")};
                  --icon-color:${escapeAttribute(tool.iconColor || "#c4ceff")}"
           aria-label="${escapeAttribute(tool.title)}を開く">
          <div class="card-top">
            <span class="tool-icon" aria-hidden="true">${escapeHTML(tool.icon || "✦")}</span>
            <span class="tag">${escapeHTML(tool.status || "公開中")}</span>
          </div>
          <h3>${escapeHTML(tool.title)}</h3>
          <p>${escapeHTML(tool.description)}</p>
          <div class="card-bottom">
            <span class="category">${escapeHTML(tool.category || "その他")}</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      `).join("");

      count.textContent = `${filtered.length} / ${tools.length}`;
      empty.style.display = filtered.length ? "none" : "block";
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function escapeAttribute(value) { return escapeHTML(value); }

    search.addEventListener("input", event => renderTools(event.target.value));
    document.getElementById("year").textContent = new Date().getFullYear();
    renderTools();
  </script>
</body>
</html>
